<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monk.AI | Autonomous Neural Intelligence</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>

<style>
body {
  margin: 0;
  background: #08080C;
  overflow-x: hidden;
}
#three-canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
  pointer-events: none;
}
</style>
</head>

<body>

<canvas id="three-canvas"></canvas>

<script>
// --------------------
// THREE SETUP
// --------------------

const canvas = document.querySelector('#three-canvas');

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  65,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.z = 6;

// --------------------
// LIGHTING
// --------------------

const keyLight = new THREE.PointLight(0xffffff, 3);
keyLight.position.set(5, 5, 5);
scene.add(keyLight);

const rimLight = new THREE.PointLight(0x8B5CF6, 4);
rimLight.position.set(-5, -5, -5);
scene.add(rimLight);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

// --------------------
// PARTICLE FIELD
// --------------------

const particleGeometry = new THREE.BufferGeometry();
const count = 4000;
const positions = new Float32Array(count * 3);

for (let i = 0; i < count * 3; i++) {
  positions[i] = (Math.random() - 0.5) * 20;
}

particleGeometry.setAttribute(
  'position',
  new THREE.BufferAttribute(positions, 3)
);

const particleMaterial = new THREE.PointsMaterial({
  size: 0.02,
  color: 0x8B5CF6,
  transparent: true,
  opacity: 0.4
});

const particles = new THREE.Points(particleGeometry, particleMaterial);
scene.add(particles);

// --------------------
// METALLIC COIN
// --------------------

const coinGeometry = new THREE.CylinderGeometry(2, 2, 0.4, 128);

const coinMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xD4AF37,
  metalness: 1,
  roughness: 0.15,
  clearcoat: 1,
  clearcoatRoughness: 0
});

const coin = new THREE.Mesh(coinGeometry, coinMaterial);
scene.add(coin);

coin.rotation.x = Math.PI / 2;

// --------------------
// ADD MAI TEXT
// --------------------

const loader = new THREE.FontLoader();

loader.load(
  'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json',
  function (font) {

    const textGeometry = new THREE.TextGeometry('MAI', {
      font: font,
      size: 0.8,
      height: 0.12,
      curveSegments: 12
    });

    textGeometry.center();

    const textMaterial = new THREE.MeshStandardMaterial({
      color: 0x111111,
      metalness: 0.9,
      roughness: 0.3
    });

    const textMesh = new THREE.Mesh(textGeometry, textMaterial);
    textMesh.position.z = 0.25;

    coin.add(textMesh);
  }
);

// --------------------
// MOUSE INTERACTION
// --------------------

let mouseX = 0;
let mouseY = 0;

document.addEventListener('mousemove', (event) => {
  mouseX = (event.clientX / window.innerWidth - 0.5) * 2;
  mouseY = (event.clientY / window.innerHeight - 0.5) * 2;
});

// --------------------
// ANIMATION LOOP
// --------------------

function animate(time) {

  particles.rotation.y = time * 0.00005;

  coin.rotation.z += 0.01;

  camera.position.x += (mouseX * 1.5 - camera.position.x) * 0.05;
  camera.position.y += (-mouseY * 1.5 - camera.position.y) * 0.05;

  camera.lookAt(scene.position);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

// --------------------
// RESPONSIVE
// --------------------

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
