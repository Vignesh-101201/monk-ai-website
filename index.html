<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monk.AI | Institutional Neural Protocol</title>

<!-- Libraries -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.10.0/dist/ethers.umd.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

<style>
:root { --bg:#08080C; --accent:#8B5CF6; }
body {
    font-family:'Plus Jakarta Sans',sans-serif;
    background:var(--bg);
    color:#FAF9FF;
    overflow-x:hidden;
}
.glass {
    background:rgba(13,13,20,0.7);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.08);
}
#three-canvas {
    position:fixed;
    top:0;left:0;
    z-index:0;
    pointer-events:none;
}
.terminal-line {
    opacity:0;
    transform:translateX(-5px);
    animation:slideIn .3s forwards;
}
@keyframes slideIn { to{opacity:1;transform:translateX(0);} }
</style>
</head>
<body>

<canvas id="three-canvas"></canvas>

<!-- NAV -->
<nav class="fixed w-full z-50 pt-6 px-6">
<div class="max-w-7xl mx-auto glass rounded-2xl flex justify-between items-center px-8 py-4">
<div class="text-2xl font-bold">MONK<span class="text-purple-500">AI</span></div>

<button id="connectWallet" class="bg-white text-black px-6 py-2.5 rounded-xl font-bold text-sm hover:scale-105 transition-transform">
Connect Wallet
</button>
</div>
</nav>

<!-- HERO -->
<section class="relative z-10 min-h-screen flex flex-col items-center justify-center text-center px-6">
<h1 class="text-6xl md:text-8xl font-extrabold mb-6">
THE NEURAL <span class="text-purple-500">ECONOMY</span>
</h1>
<p class="text-gray-400 max-w-xl">
Monk.AI ($MAI) governs autonomous cross-chain liquidity nodes.
</p>
</section>

<!-- TOKENOMICS -->
<section class="py-32 px-6 relative z-10 text-center">
<h2 class="text-4xl font-bold mb-10">Token Distribution</h2>
<div class="max-w-md mx-auto">
<canvas id="distributionChart"></canvas>
</div>
</section>

<!-- TERMINAL -->
<section class="py-20 relative z-10 text-center">
<div id="terminal" class="glass max-w-2xl mx-auto p-6 h-60 overflow-y-auto font-mono text-sm"></div>
</section>

<!-- FOOTER -->
<footer class="py-20 text-center text-gray-500 relative z-10">
© 2025 MONK.AI
</footer>

<script>
lucide.createIcons();

/* ============================
   THREE JS BACKGROUND
============================ */
const canvas = document.querySelector('#three-canvas');
const renderer = new THREE.WebGLRenderer({canvas,alpha:true});
renderer.setSize(window.innerWidth,window.innerHeight);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.z = 5;

const geo = new THREE.BufferGeometry();
const count = 2000;
const pos = new Float32Array(count*3);
for(let i=0;i<count*3;i++){ pos[i]=(Math.random()-0.5)*15; }
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
const mat = new THREE.PointsMaterial({size:0.015,color:0x8B5CF6});
const points = new THREE.Points(geo,mat);
scene.add(points);

function animate(time){
points.rotation.y = time*0.00005;
renderer.render(scene,camera);
requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

/* ============================
   CHART.JS
============================ */
const ctx = document.getElementById('distributionChart');
new Chart(ctx,{
type:'doughnut',
data:{
labels:['Public','Rewards','Treasury','Team'],
datasets:[{
data:[40,30,20,10],
backgroundColor:['#8B5CF6','#2563EB','#059669','#334155'],
borderWidth:0
}]
},
options:{plugins:{legend:{display:false}},cutout:'70%'}
});

/* ============================
   TERMINAL LOG
============================ */
const terminal = document.getElementById('terminal');
const logs = [
"Initializing Monk.AI Neural Core...",
"Checking $MAI Contract... OK",
"Bridge Sync: Ethereum / BNB",
"Liquidity Scan: +$1.2M detected",
"Autonomous Node Activated",
"Governance Proposal #84 Live",
"Total Supply Verified: 1B MAI"
];
let i=0;
function logLine(){
const line=document.createElement('div');
line.className='terminal-line text-gray-400 mb-1';
line.innerHTML=`<span class="text-purple-500 font-bold">>></span> ${logs[i%logs.length]}`;
terminal.appendChild(line);
terminal.scrollTop=terminal.scrollHeight;
i++;
setTimeout(logLine,1500);
}
logLine();

/* ============================
   WALLET CONNECTION
============================ */
const connectBtn=document.getElementById("connectWallet");
let provider,signer,userAddress;

async function connectWallet(){
if(!window.ethereum){
alert("Please install MetaMask.");
return;
}
try{
provider=new ethers.BrowserProvider(window.ethereum);
await provider.send("eth_requestAccounts",[]);
signer=await provider.getSigner();
userAddress=await signer.getAddress();

const shortAddress=userAddress.slice(0,6)+"..."+userAddress.slice(-4);
connectBtn.innerText=shortAddress;
connectBtn.classList.remove("bg-white","text-black");
connectBtn.classList.add("bg-purple-600","text-white");

console.log("Connected:",userAddress);
}catch(err){
console.error(err);
}
}
connectBtn.addEventListener("click",connectWallet);

/* ============================
   GSAP
============================ */
gsap.registerPlugin(ScrollTrigger);
gsap.from("section",{
opacity:0,
y:40,
duration:1,
scrollTrigger:{trigger:"section",start:"top 85%"}
});

window.addEventListener('resize',()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
